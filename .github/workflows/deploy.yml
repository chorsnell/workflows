name: build-and-deploy

on:
  workflow_call:
    inputs:
      app:
        type: string
        required: true
      version:
        # Release version (e.g. 1.4.2 or v1.4.2). When set, the image is also tagged :1.4.2 and :1.4 so a
        # deploy can be pinned or rolled back to it. Every build is tagged :latest and :<commit sha>.
        type: string
        required: false
        default: ''

jobs:
  build:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: tags
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          v="${VERSION#v}"
          {
            echo 'list<<EOF'
            echo "$IMAGE:latest"
            echo "$IMAGE:$GITHUB_SHA"
            if [ -n "$v" ]; then
              echo "$IMAGE:$v"
              echo "$IMAGE:${v%.*}"
            fi
            echo 'EOF'
            echo "version=${v:-$GITHUB_SHA}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      # Hosted runners reach the Docker host over Tailscale; the self-hosted runner is already on the LAN.
      - if: runner.environment == 'github-hosted'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          APP: ${{ inputs.app }}
          # docker-host is the Tailscale name; on the LAN use the host's address (override with the DEPLOY_HOST variable)
          HOST: ${{ runner.environment == 'github-hosted' && 'docker-host' || vars.DEPLOY_HOST || '192.168.0.106' }}
        run: |
          # The self-hosted runner keeps its workspace between jobs, so don't leave the key behind
          key="$RUNNER_TEMP/deploy_key"
          trap 'rm -f "$key"' EXIT
          install -m 600 /dev/null "$key"
          printf '%s\n' "$KEY" > "$key"
          ssh -i "$key" -o StrictHostKeyChecking=accept-new deploy@"$HOST" "$APP"
