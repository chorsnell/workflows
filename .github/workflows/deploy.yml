name: build-and-deploy

on:
  workflow_call:
    inputs:
      app:
        type: string
        required: true
      version:
        # Release version (e.g. 1.4.2 or v1.4.2). When set, the image is also tagged :1.4.2 and :1.4 so a
        # deploy can be pinned or rolled back to it. Every build is tagged :latest and :<commit sha>.
        type: string
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: tags
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          v="${VERSION#v}"
          {
            echo 'list<<EOF'
            echo "$IMAGE:latest"
            echo "$IMAGE:$GITHUB_SHA"
            if [ -n "$v" ]; then
              echo "$IMAGE:$v"
              echo "$IMAGE:${v%.*}"
            fi
            echo 'EOF'
            echo "version=${v:-$GITHUB_SHA}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          APP: ${{ inputs.app }}
        run: |
          install -m 600 /dev/null key
          printf '%s\n' "$KEY" > key
          ssh -i key -o StrictHostKeyChecking=accept-new deploy@docker-host "$APP"