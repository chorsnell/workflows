name: release
# Shared release job. A repo calls it from its own .github/workflows/release.yml (copy templates/release.yml), which
# the owner runs by hand: Actions → release → Run workflow. It:
#
#   1. runs the repo's tests on main
#   2. works out the next version from the conventional commits since the last vX.Y.Z tag
#      (feat → minor, fix/perf → patch, a ! or BREAKING CHANGE footer → major; on 0.x each lands one place lower),
#      or uses the bump picked in the form
#   3. writes the new CHANGELOG.md section, each line linked to its pull request (scripts/changelog-prs.mjs), and
#      bumps the version files listed in the repo's .versionrc.json (package.json, or a VERSION file for Go)
#   4. commits "chore(release): vX.Y.Z" to main, tags it vX.Y.Z
#   5. builds the release assets (if any) with VERSION=X.Y.Z set and publishes the GitHub release with them
#   6. starts the repo's deploy workflow (if any) on the vX.Y.Z tag with `version: X.Y.Z`
#
# "Preview only" shows the next version and changelog in the run summary and changes nothing.
#
# The first release of a repo with no vX.Y.Z tag yet starts its history at the commit that added .versionrc.json
# (tagged v<current version>), so the first changelog doesn't list the repo's whole past.

on:
  workflow_call:
    inputs:
      dry_run:
        description: Preview only
        type: boolean
        default: false
      release_as:
        description: auto, patch, minor or major
        type: string
        default: auto
      runs_on:
        description: Runner label for the job
        type: string
        default: self-hosted
      node_version:
        description: Node.js for the release tooling (and the repo's own commands)
        type: string
        default: '22'
      go_version_file:
        description: Set up Go from this file (usually go.mod); empty for no Go
        type: string
        default: ''
      test:
        description: Shell command that must pass before anything is changed; empty for none
        type: string
        default: ''
      build:
        description: Shell command that builds the release assets, run after the bump with VERSION=X.Y.Z; empty for none
        type: string
        default: ''
      assets:
        description: Files to attach to the GitHub release, space-separated globs (e.g. dist/*); empty for none
        type: string
        default: ''
      deploy_workflow:
        description: Workflow file to start after the release (e.g. deploy.yml), given `version`; empty for none
        type: string
        default: ''
    outputs:
      version:
        description: The version released (X.Y.Z), empty on a preview
        value: ${{ jobs.release.outputs.version }}

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: write        # release commit, tag, GitHub release
      actions: write         # start the deploy workflow
      pull-requests: read    # link each changelog line to its pull request
    outputs:
      version: ${{ steps.push.outputs.version }}
    env:
      DRY_RUN: ${{ inputs.dry_run }}
      RELEASE_AS: ${{ inputs.release_as }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases are cut from main (this run is on ${GITHUB_REF})."
          exit 1

      - name: Check the bump
        run: |
          case "$RELEASE_AS" in auto|patch|minor|major) ;; *)
            echo "::error::release_as must be auto, patch, minor or major (got '$RELEASE_AS')."; exit 1;;
          esac

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get the shared scripts
        run: |
          shared="$RUNNER_TEMP/shared-workflows"
          rm -rf "$shared"
          git clone --depth 1 --quiet https://github.com/chorsnell/workflows "$shared"
          echo "SHARED=$shared" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - if: inputs.go_version_file != ''
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ inputs.go_version_file }}

      - name: Check the repo is set up
        run: |
          [ -f .versionrc.json ] || { echo "::error::No .versionrc.json: see 'Adding a repo' in chorsnell/workflows."; exit 1; }
          [ -f CHANGELOG.md ] || { echo "::error::No CHANGELOG.md: see 'Adding a repo' in chorsnell/workflows."; exit 1; }
          if [ -f VERSION ]; then echo "VERSION_SOURCE=VERSION" >> "$GITHUB_ENV"
          elif [ -f package.json ]; then echo "VERSION_SOURCE=package.json" >> "$GITHUB_ENV"
          else echo "::error::No VERSION file or package.json to read the version from."; exit 1; fi

      - name: Start the history if nothing is tagged yet
        run: |
          if [ -n "$(git tag -l 'v[0-9]*')" ]; then exit 0; fi
          if [ "$VERSION_SOURCE" = VERSION ]; then cur=$(tr -d ' \r\n' < VERSION); else cur=$(node -p "require('./package.json').version"); fi
          base=$(git log --diff-filter=A --format=%H -- .versionrc.json | tail -1)
          [ -n "$base" ] || { echo "::error::Can't find the commit that added .versionrc.json."; exit 1; }
          echo "No vX.Y.Z tag yet: history starts at $(git log -1 --format='%h %s' "$base") as v$cur"
          git tag "v$cur" "$base"
          [ "$DRY_RUN" = true ] || git push origin "v$cur"

      - name: Check there is something to release
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*')
          n=$(git log "$last..HEAD" --no-merges --format=%s | grep -cE '^(feat|fix|perf|revert)(\(.+\))?!?:' || true)
          echo "$n user-facing change(s) since $last"
          if [ "$n" = 0 ] && [ "$RELEASE_AS" = auto ]; then
            echo "::error::Nothing to release since $last: no feat, fix, perf or revert commits. Pick a bump to release anyway."
            exit 1
          fi

      - name: Test
        if: inputs.test != ''
        env:
          CMD: ${{ inputs.test }}
        run: bash -eo pipefail -c "$CMD"

      - name: Bump the version and write the changelog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # A CHANGELOG.md with no release in it yet is just the header, which the release tool would keep under its
          # own copy of it. Start it empty instead; the tool writes the header from .versionrc.json.
          if [ "$DRY_RUN" != true ] && ! grep -qE '^#+ \[?[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md; then : > CHANGELOG.md; fi
          args=(--skip.commit --skip.tag)
          [ "$RELEASE_AS" = auto ] || args+=(--release-as "$RELEASE_AS")
          [ "$DRY_RUN" = true ] && args+=(--dry-run)
          npx --yes commit-and-tag-version@12 "${args[@]}" | tee "$RUNNER_TEMP/bump.txt"
          if [ "$DRY_RUN" = true ]; then
            { echo '## Preview'; echo; grep -E '^. bumping version' "$RUNNER_TEMP/bump.txt" || true; echo
              sed -n '/^---$/,/^---$/p' "$RUNNER_TEMP/bump.txt" | sed '1d;$d'; } >> "$GITHUB_STEP_SUMMARY"
          else
            node "$SHARED/scripts/changelog-prs.mjs" --latest
          fi

      - name: Commit and tag
        if: inputs.dry_run == false
        id: push
        run: |
          if [ "$VERSION_SOURCE" = VERSION ]; then v=$(tr -d ' \r\n' < VERSION); else v=$(node -p "require('./package.json').version"); fi
          git add -u
          git add CHANGELOG.md
          git commit -q -m "chore(release): v$v"
          git tag "v$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build the release assets
        if: inputs.dry_run == false && inputs.build != ''
        env:
          CMD: ${{ inputs.build }}
          VERSION: ${{ steps.push.outputs.version }}
        run: bash -eo pipefail -c "$CMD"

      - name: Push the release commit and tag
        if: inputs.dry_run == false
        env:
          V: ${{ steps.push.outputs.version }}
        run: git push --atomic origin HEAD:main "v$V"

      - name: Publish the GitHub release
        if: inputs.dry_run == false
        env:
          V: ${{ steps.push.outputs.version }}
          ASSETS: ${{ inputs.assets }}
        run: |
          # The notes are the section CHANGELOG.md just got (from its heading to the next one)
          awk 'n && /^## /{exit} /^## /{n=1; next} n' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          files=()
          if [ -n "$ASSETS" ]; then
            shopt -s nullglob
            for g in $ASSETS; do for f in $g; do [ -f "$f" ] && files+=("$f"); done; done
            [ ${#files[@]} -gt 0 ] || { echo "::error::No files matched assets '$ASSETS'."; exit 1; }
          fi
          gh release create "v$V" --title "v$V" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag "${files[@]}"
          { echo "## Released v$V"; echo; cat "$RUNNER_TEMP/notes.md"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Start the deploy
        if: inputs.dry_run == false && inputs.deploy_workflow != ''
        env:
          V: ${{ steps.push.outputs.version }}
          WF: ${{ inputs.deploy_workflow }}
        run: |
          # Runs from the vX.Y.Z tag, so it builds exactly what was released. (workflow_dispatch is the one event this
          # job's token may start another workflow with.)
          gh workflow run "$WF" --ref "v$V" -f version="$V"
          echo "Deploy of v$V started: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/workflows/$WF" >> "$GITHUB_STEP_SUMMARY"
